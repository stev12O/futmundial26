    .share-bar {

    }
    .share-bar span {

    .share-btn {
      display: inline-flex;

    .related-grid {

    .article-sidebar {
      position: sticky;

    .article-layout {
      display: grid;

      gap: 2rem;

    @media (max-width: 900px) {
      .article-layout {
        grid-template-columns: 1fr;

    .sidebar-ad-slot {

  <script src="script.js?v=5"></script>
  <script>
    // ---- Article Detail Page Logic ----
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const articleId = parseInt(params.get('id'));

      if (!articleId) {
        window.location.href = 'noticias.html';
        return;
      }

      // Fetch articles
      let articles = [];
      try {
        const res = await fetch('data/articles.json?t=' + Date.now());
        articles = await res.json();
      } catch(e) {
        document.getElementById('article-detail').innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:4rem;">Error loading article.</p>';
        return;
      }

      const article = articles.find(a => a.id === articleId);
      if (!article) {
        document.getElementById('article-detail').innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:4rem;">Artículo no encontrado.</p>';
        return;
      }

      // Update page title & meta
      document.title = article.title + ' — FutMundial26 | World Cup 2026';
      document.getElementById('og-title').content = article.title;
      document.getElementById('og-desc').content = article.excerpt;
      document.getElementById('og-image').content = article.image;
      document.getElementById('breadcrumb-title').textContent = article.title.substring(0, 50) + '...';

      // Generate article body (expanded from excerpt)
      const articleBody = generateArticleBody(article);

      // Render article
      const shareUrl = encodeURIComponent(window.location.href);
      const shareText = encodeURIComponent(article.title);

      document.getElementById('article-detail').innerHTML = `
        <span class="article-badge">${article.categoryIcon || '📰'} ${article.categoryLabel || 'NOTICIAS'}</span>
        <h1>${article.title}</h1>
        <div class="article-meta">
          <span><i class="far fa-clock"></i> ${article.time}</span>
          <span><i class="far fa-user"></i> ${article.author}</span>
          <span><i class="far fa-comment"></i> ${article.comments || 0} comentarios</span>
          <span><i class="far fa-eye"></i> ${article.views || 0} vistas</span>
        </div>
        <img src="${article.image}" alt="${article.title}" class="article-hero" loading="lazy">

        <div class="article-body">
          ${articleBody}
        </div>

        <!-- Inline Ad Slot (mid-article) -->
        <div class="inline-ad-slot" id="inline-ad-1">
          <!-- Ad slot ready -->
        </div>

        <!-- Share Bar -->
        <div class="share-bar">
          <span><i class="fas fa-share-alt"></i> Compartir:</span>
          <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}" target="_blank" class="share-btn" title="Share on X/Twitter"><i class="fab fa-x-twitter"></i></a>
          <a href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}" target="_blank" class="share-btn" title="Share on Facebook"><i class="fab fa-facebook-f"></i></a>
          <a href="https://api.whatsapp.com/send?text=${shareText}%20${shareUrl}" target="_blank" class="share-btn" title="Share on WhatsApp"><i class="fab fa-whatsapp"></i></a>
          <a href="https://t.me/share/url?url=${shareUrl}&text=${shareText}" target="_blank" class="share-btn" title="Share on Telegram"><i class="fab fa-telegram-plane"></i></a>
          <button class="share-btn" onclick="navigator.clipboard.writeText(window.location.href).then(()=>this.innerHTML='<i class=\\'fas fa-check\\'></i>')" title="Copy link"><i class="fas fa-link"></i></button>
        </div>

        <!-- Related Articles -->
        <div class="related-section">
          <h3>📰 Noticias Relacionadas</h3>
          <div class="related-grid" id="related-grid"></div>
        </div>
      `;

      // Render related articles (same category, excluding current)
      const related = articles
        .filter(a => a.id !== articleId)
        .slice(0, 3);

      document.getElementById('related-grid').innerHTML = related.map(a => `
        <article class="article-card" onclick="window.location.href='noticia.html?id=${a.id}'">
          <div class="thumb">
            <img src="${a.image}" alt="${a.title}" loading="lazy">
            <span class="category-badge">${a.categoryIcon || '📰'} ${a.categoryLabel || 'NOTICIAS'}</span>
          </div>
          <div class="content">
            <h3>${a.title}</h3>
            <div class="meta">
              <span><i class="far fa-clock"></i> ${a.time}</span>
              <span><i class="far fa-eye"></i> ${a.views || 0}</span>
            </div>
          </div>
        </article>
      `).join('');

      // Sidebar: more news
      const sidebarArticles = articles
        .filter(a => a.id !== articleId)
        .slice(0, 5);

      document.getElementById('sidebar-articles').innerHTML = sidebarArticles.map(a => `
        <div class="trending-item" style="cursor:pointer;" onclick="window.location.href='noticia.html?id=${a.id}'">
          <span class="rank">${a.categoryIcon || '📰'}</span>
          <div class="info">
            <h5>${a.title.substring(0, 60)}...</h5>
            <span>${a.time} • ${a.views} vistas</span>
          </div>
        </div>
      `).join('');
    })();

    // Generate article body - uses real content if available
    function generateArticleBody(article) {
      // If article has a body field (written from admin), use it
      if (article.body && article.body.trim().length > 0) {
        // Convert plain text paragraphs to HTML
        const paragraphs = article.body.split(/\n\n+/).map(p => {
          p = p.trim();
          if (!p) return '';
          return `<p>${p.replace(/\n/g, '<br>')}</p>`;
        }).filter(p => p);
        
        // Add excerpt as bold intro
        return `<p><strong>${article.excerpt}</strong></p>\n${paragraphs.join('\n')}\n<h2>Sigue el Mundial en CrazyDeportes</h2>\n<p>En CrazyDeportes te mantenemos informado minuto a minuto con todas las noticias, resultados en vivo, estadísticas y análisis del Mundial 2026.</p>`;
      }

      // Fallback: auto-generate from excerpt (for older articles without body)
      const excerpt = article.excerpt;
      const paragraphs = [];
      paragraphs.push(`<p><strong>${excerpt}</strong></p>`);
      paragraphs.push(`<p>El Mundial FIFA 2026 marca un hito histórico al ser el primero con 48 selecciones participantes y el primero en celebrarse en tres países: Estados Unidos, México y Canadá. Con 104 partidos distribuidos en 16 ciudades, será el torneo más grande jamás organizado.</p>`);
      paragraphs.push(`<h2>Lo Que Debes Saber</h2>`);
      paragraphs.push(`<p>FIFA ha implementado nuevas reglas para esta edición, incluyendo cambios en el formato de grupos y la incorporación de tecnología avanzada para mejorar la experiencia tanto de los jugadores como de los espectadores.</p>`);
      paragraphs.push(`<h2>Sigue el Mundial en CrazyDeportes</h2>`);
      paragraphs.push(`<p>En CrazyDeportes te mantenemos informado minuto a minuto con todas las noticias, resultados en vivo, estadísticas y análisis del Mundial 2026. No te pierdas ningún detalle del torneo más importante del fútbol mundial.</p>`);
      return paragraphs.join('\n');
    }
  </script>
