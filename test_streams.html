<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Streams</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; }
    .stream-test { border: 1px solid #333; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #222; }
    .status { font-weight: bold; margin-top: 10px; }
    .success { color: #4caf50; }
    .fail { color: #f44336; }
    video { display: block; width: 320px; height: 180px; background: #000; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Testing Streams</h1>
  <div id="tests"></div>

  <script>
    const streams = [
      { name: "Canal 26 (Argentina)", url: "https://stream-gtlc.telecentro.net.ar/hls/canal26hls/main.m3u8" },
      { name: "Canal 5 (México)", url: "http://45.5.119.43:4000/play/a05o/index.m3u8" },
      { name: "Latina (Perú)", url: "https://redirector.rudo.video/hls-video/567ffde3fa319fadf3419efda25619456231dfea/latina/latina.smil/playlist.m3u8" },
      { name: "Ecuavisa (Ecuador - Quito)", url: "https://redirector.dps.live/hls-video/c54ac2799874375c81c1672abb700870537c5223/ecuavisa/ecuavisa.smil/playlist.m3u8" },
      { name: "TeleSUR (Venezuela/Int)", url: "https://mblesmain01.telesur.ultrabase.net/mbliveMain/hd/chunklist.m3u8" },
      { name: "DW (Int)", url: "https://dwamdstream104.akamaized.net/hls/live/2015530/dwstream104/index.m3u8" },
      { name: "TyC Sports (Argentina)", url: "https://amg26268-amg26268c14-freelivesports-emea-10267.playouts.now.amagi.tv/ts-us-e2-n2/playlist/amg26268-sportsstudio-tycsports-freelivesportsemea/playlist.m3u8" },
      { name: "FIFA+ (Int)", url: "https://6c849fb3.wurl.com/master/f36d25e7e52f1ba8d7e56eb859c636563214f541/TEctbXhfRklGQVBsdXNTcGFuaXNoLTFfSExT/playlist.m3u8" },
      { name: "Azteca Internacional (México)", url: "https://azt-mun.otteravision.com/azt/mun/mun.m3u8" },
      { name: "ITV Deportes (México)", url: "https://thm-it-roku.otteravision.com/thm/it/it.m3u8" },
      { name: "Dsports Iframe (canalesdeportivos)", url: "https://canalesdeportivos.net/directvsports.php", isIframe: true },
      { name: "Chilevisión Iframe (canalesdeportivos)", url: "https://canalesdeportivos.net/chilevision.php", isIframe: true }
    ];

    const container = document.getElementById('tests');

    streams.forEach((s, index) => {
      const div = document.createElement('div');
      div.className = 'stream-test';
      if (s.isIframe) {
        div.innerHTML = `
          <h3>${s.name}</h3>
          <p>URL: <code>${s.url}</code></p>
          <iframe id="iframe-${index}" src="${s.url}" style="width: 320px; height: 180px; border: none; background: #000;"></iframe>
          <div class="status" id="status-${index}">Iframe loaded. Check if stream plays inside it.</div>
        `;
        container.appendChild(div);
      } else {
        div.innerHTML = `
          <h3>${s.name}</h3>
          <p>URL: <code>${s.url}</code></p>
          <video id="video-${index}" controls muted></video>
          <div class="status" id="status-${index}">Testing...</div>
        `;
        container.appendChild(div);

        const video = document.getElementById(`video-${index}`);
        const statusEl = document.getElementById(`status-${index}`);

        if (Hls.isSupported()) {
          const hls = new Hls({
            enableWorker: true,
            lowLatencyMode: false,
            manifestLoadingTimeOut: 8000,
            manifestLoadingMaxRetry: 1
          });
          hls.loadSource(s.url);
          hls.attachMedia(video);

          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            statusEl.innerHTML = '<span class="success">MANIFEST PARSED! Trying to play...</span>';
            video.play().then(() => {
              statusEl.innerHTML = '<span class="success">SUCCESS - PLAYING!</span>';
            }).catch(err => {
              statusEl.innerHTML = '<span class="success">MANIFEST LOADED (autoplay blocked)</span>';
            });
          });

          hls.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
              statusEl.innerHTML = `<span class="fail">FAILED: ${data.details || 'fatal HLS error'}</span>`;
              hls.destroy();
            }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = s.url;
          video.play().then(() => {
            statusEl.innerHTML = '<span class="success">SUCCESS - PLAYING (native)</span>';
          }).catch(err => {
            statusEl.innerHTML = '<span class="fail">FAILED native playback</span>';
          });
        }
      }
    });
  </script>
</body>
</html>
